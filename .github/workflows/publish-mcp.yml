name: Publish to MCP Registry
on:
  push:
    branches: [main]
    paths:
      - 'server.json'
      - '.github/workflows/publish-mcp.yml'
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL -o mp.tar.gz https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar xzf mp.tar.gz
          chmod +x mcp-publisher
      - name: Authenticate with registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
